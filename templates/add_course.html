{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2>授業追加</h2>
    <form action="/admin/add_course" method="POST">
        <label for="course_name">授業名</label>
        <input type="text" name="course_name" required><br>

        <label for="teacher">教員名</label>
        <input type="text" name="teacher" required><br>
        
        <label for="evaluation">評価方法</label>
        <input type="text" name="evaluation" required><br>
        
        <label for="method">授業形式</label>
        <input type="text" name="method" required><br>

        <label for="difficulty">難易度</label>
        <input type="number" step="0.1" name="difficulty" required><br>

        <button type="submit">授業追加</button>
    </form>
</div>
{% endblock %}
